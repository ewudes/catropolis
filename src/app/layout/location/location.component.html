<section class="location" [class.location--index]="variant === 'index'">
  <h2 class="visually-hidden">Адрес и расположение магазина</h2>
  <div class="address">
    <div class="address__wrap">
      <h3 class="address__title">
        Приглашаем к сотрудничеству дилеров!
      </h3>
      <p class="address__description">
        ул. Большая Конюшенная, д. 19/8 <br><br>Санкт-Петербург
      </p>
    </div>
  </div>
  <div class="map">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1998.600068666756!2d30.32100801640967!3d59.938778181876216!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4696310fca640933%3A0x8403eb878242dbd5!2z0JTQvtGF0L7QtNC90YvQuSDQtNC-0Lwg0J0uINCQLiDQnNC10LvRjNGG0LXRgNCw!5e0!3m2!1sru!2sru!4v1589930165452!5m2!1sru!2sru"
      height="700"
      [class.map__iframe--index]="variant === 'index'"
      class="map__iframe"
      allowfullscreen
      aria-hidden="false"
      tabindex="0"
    ></iframe>
  </div>
</section>
