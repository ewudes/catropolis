<article class="product-card">
  <a href="#" class="product-card__image" (click)="$event.preventDefault()">
    <picture>
      <source type="image/webp" media="(min-width: 1300px)" [srcset]="'assets/img/' + product.imageSlug + '-desktop@1x.webp 1x, assets/img/' + product.imageSlug + '-desktop@2x.webp 2x'">
      <source media="(min-width: 1300px)" [srcset]="'assets/img/' + product.imageSlug + '-desktop@1x.png 1x, assets/img/' + product.imageSlug + '-desktop@2x.png 2x'">
      <source type="image/webp" media="(min-width: 768px)" [srcset]="'assets/img/' + product.imageSlug + '-tablet@1x.webp 1x, assets/img/' + product.imageSlug + '-tablet@2x.webp 2x'">
      <source media="(min-width: 768px)" [srcset]="'assets/img/' + product.imageSlug + '-tablet@1x.png 1x, assets/img/' + product.imageSlug + '-tablet@2x.png 2x'">
      <source type="image/webp" [srcset]="'assets/img/' + product.imageSlug + '-mobile@1x.webp 1x, assets/img/' + product.imageSlug + '-mobile@2x.webp 2x'">
      <img
        class="product-card__pic"
        [src]="'assets/img/' + product.imageSlug + '-mobile@1x.jpg'"
        [srcset]="'assets/img/' + product.imageSlug + '-mobile@2x.jpg 2x'"
        [alt]="'Изображение продукта Cat energy ' + product.series + ' ' + product.volume + ', с ' + (product.flavor | lowercase)"
      >
    </picture>
  </a>
  <div class="product-card__description">
    <h4 class="product-card__title">
      <a class="product-card__link" href="#" (click)="$event.preventDefault()">Cat energy <br>{{ product.series }} {{ product.volume }}</a>
    </h4>
    <table class="product-card__meta">
      <tbody>
        <tr>
          <td>Объем</td>
          <td>{{ product.volume }}</td>
        </tr>
        <tr>
          <td>Вкус</td>
          <td>{{ product.flavor }}</td>
        </tr>
        <tr>
          <td>Цена</td>
          <td>{{ product.price }} Р.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <button type="button" class="button product-card__btn-order" (click)="onOrder($event)">Заказать</button>
</article>
